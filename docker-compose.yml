services:
  user-container:
    container_name: realsense-add-on
    group_add:
      - video
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    # Make sure the container can access the host's network
    privileged: true
    ipc: host
    network_mode: host
    # Start the container on boot, unless the container is stopped
    restart: unless-stopped
    # Enable support for GPU usage in the container.
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 'all'
              capabilities: [ gpu ]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      # Mount a workspace to the container to allow the user to make persistent changes. Shared with the standard user container's workspace, so /data/user/containers must exist. Point this at ./ws instead for a separate workspace.
      - type: bind
        source: /data/user/containers/ws
        target: /home/user/ws
      # Expose the USB devices to the container
      - type: bind
        source: /dev/bus/usb
        target: /dev/bus/usb
      - type: bind
        source: /dev/
        target: /dev/
    # Uncomment the following line to automatically start the ROS nodes
    #command: ros2 launch pkg launch_file.py
    # Device name varies by Vertex software version: /dev/video-rs-rgb or /dev/video_rs_rgb. Check `ls /dev | grep video-rs` on the host if this device isn't found.
    #command: gst-launch-1.0 v4l2src device=/dev/video-rs-rgb ! videoconvert ! video/x-raw,format=BGRx ! nvvidconv ! nvv4l2h265enc control-rate=0 bitrate=1000000 peak-bitrate=2000000 preset-level=1 ! h265parse ! rtspclientsink location=rtsp://0.0.0.0:8554/realsense
    command: sleep infinity
